# ============================================================
# Experiment: M2+I2 — Hybrid CNN-Mamba + Centerline Head (PROPOSED)
# ============================================================
experiment_name: hybrid_unet_i2
model: hybrid_unet
seed: 42

# Data
data_root: data/DCA1
split_file: splits/split.json
input_size: 320
num_workers: 4

# Training
epochs: 100
batch_size: 4

# Optimizer
optimizer: adamw
lr: 1.0e-4
weight_decay: 1.0e-4

# Scheduler
scheduler: cosine

# Loss — includes clDice and auxiliary skeleton BCE
loss: bce_dice_cldice
pos_weight: auto
bce_weight: 1.0
dice_weight: 1.0
cldice_weight: 0.5        # λ — clDice loss weight
skel_weight: 0.3          # μ — auxiliary skeleton BCE weight

# Gradient clipping
grad_clip: 1.0

# Early stopping (on val clDice preferred for topology quality)
early_stop_metric: val_cldice
early_stop_patience: 20

# Threshold
threshold: 0.5

# Augmentation
augmentation: true

# Post-processing
min_component_size: 50
apply_closing: false

# *** INNOVATION I2 ENABLED ***
use_innovation_i2: true

# Hybrid architecture settings
cnn_stages: 2
vss_stages: 2
channels: [32, 64, 128, 256, 512]

# Logging / output
log_dir: results/runs/hybrid_unet_i2
checkpoint_dir: results/checkpoints/hybrid_unet_i2
save_predictions: true
